name: Withdraw retired RC installers
on:
  push:
    branches: ['codex/withdraw-rc10-windows-20261128']
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only explicitly retired assets and verify Linux RC11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          base = 'https://api.github.com/repos/gholguin/AndresPDFSigner-releases'
          def api(path, method='GET', body=None):
              raw = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base+path, data=raw, method=method, headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          targets = {
              'v1.0.0-rc10': {
                  'andres-pdf-signer_1.0.0.rc10_amd64.deb':714712827,
                  'AndresPDFSigner-1.0.0-rc10-setup.exe':714782658,
                  'SHA256SUMS-rc10-linux.txt':714713589,
                  'SHA256SUMS-rc10-windows.txt':714782659},
              'v1.0.0-rc11': {
                  'AndresPDFSigner-1.0.0-rc11-setup.exe':781598342,
                  'SHA256SUMS-rc11-windows.txt':781598341}}
          releases = {tag:api('/releases/tags/'+tag) for tag in targets}
          keep_names = {'andres-pdf-signer_1.0.0.rc11_amd64.deb','SHA256SUMS-rc11-ubuntu.txt'}
          original_keep = {a['name']:(a['id'],a['digest'],a['size']) for a in releases['v1.0.0-rc11']['assets'] if a['name'] in keep_names}
          assert set(original_keep)==keep_names
          for tag,names in targets.items():
              for a in releases[tag]['assets']:
                  if a['name'] in names:
                      assert a['id']==names[a['name']], (tag,a['name'],'asset ID changed')
          for tag,names in targets.items():
              for a in releases[tag]['assets']:
                  if a['name'] in names:
                      api('/releases/assets/'+str(a['id']),'DELETE')
                      print('Removed:',tag,a['name'])
          notice10='AVISO - 28 de noviembre de 2026: los instaladores RC10 de Linux y Windows y sus checksums fueron retirados. Esta versión ya no se distribuye. Solo permanece disponible el instalador RC11 para Linux. Las notas siguientes son históricas.\n\n'
          api('/releases/'+str(releases['v1.0.0-rc10']['id']),'PATCH',{'body':notice10+releases['v1.0.0-rc10']['body']})
          body11='Distribución actual: únicamente Linux. El instalador RC11 de Windows y su checksum fueron retirados el 28 de noviembre de 2026.\n\nPaquete Ubuntu 26.04.1 amd64; requiere Python 3.14 del sistema. Ubuntu 24.04 requiere una compilación independiente.\n\n'
          old=releases['v1.0.0-rc11']['body']
          if '### Ubuntu amd64' in old: body11+='### Ubuntu amd64'+old.split('### Ubuntu amd64',1)[1]
          api('/releases/'+str(releases['v1.0.0-rc11']['id']),'PATCH',{'body':body11})
          after10=api('/releases/tags/v1.0.0-rc10')
          after11=api('/releases/tags/v1.0.0-rc11')
          assert not after10['assets']
          actual={a['name']:(a['id'],a['digest'],a['size']) for a in after11['assets']}
          assert actual==original_keep
          print('Verified: RC10 assets empty; RC11 Linux installer and checksum unchanged.')
          PY
